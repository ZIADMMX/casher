# ========================================================
# OONYX POS & Cloud API - Nginx Load Balancer Configuration
# High-Availability Reverse Proxy & Health Checked Cluster
# ========================================================

worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging Settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" $upstream_response_time';

    access_log logs/access.log main;
    error_log logs/error.log warn;

    # Performance Optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;

    # Upstream Backend API Cluster (Central Nodes)
    upstream central_api_cluster {
        # Load Balancing Algorithm: least_conn (or round-robin by default)
        least_conn;

        # API Node 1 (Primary Central Node)
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;

        # API Node 2 (Secondary Central Node)
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;

        # Maintain keepalive connections to upstream for high throughput
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # Client Body Buffer (for large payloads like reports/catalogs)
        client_max_body_size 50M;
        client_body_buffer_size 128k;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Automatic Failover & Retry Settings
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        # Main API Route
        location /api/ {
            proxy_pass http://central_api_cluster;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Health Check Route
        location /lb-status {
            return 200 '{"status":"ONLINE","load_balancer":"Nginx","cluster":"central_api_cluster"}';
            add_header Content-Type application/json;
        }
    }
}
