name: Release

# Pushing a tag like v1.0.2 tests, builds the Windows installer and publishes it to
# GitHub Releases; installed apps pick it up through electron-updater.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - run: pnpm exec jest --runInBand --forceExit
      - run: pnpm exec vitest run
      - run: pnpm run release:win
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Code signing: base64 of the .pfx and its password, under Settings > Secrets > Actions.
          # Without them the installer is built unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Required by verify-license-time and the obfuscation step. Add it under Settings > Secrets > Actions.
          FOX_LICENSE_TIME_URL: ${{ secrets.FOX_LICENSE_TIME_URL }}
      # The release is built as a draft (installed apps cannot see it). It goes live only after latest.yml
      # says how many installs may take it: ROLLOUT_PERCENT repo variable, 10 by default. Widen it later
      # with the "Rollout" workflow; set it to 0 there to stop a bad release.
      - name: Publish the release at a staged percentage
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PERCENT: ${{ vars.ROLLOUT_PERCENT || '10' }}
        run: |
          node scripts/set-rollout.js release/latest.yml "$PERCENT"
          release_id=$(gh api "repos/ZIADMMX/fox-releases/releases" --paginate --jq ".[] | select(.tag_name==\"$GITHUB_REF_NAME\") | .id" | head -n1)
          asset_id=$(gh api "repos/ZIADMMX/fox-releases/releases/$release_id" --jq '.assets[] | select(.name=="latest.yml") | .id')
          gh api --method DELETE "repos/ZIADMMX/fox-releases/releases/assets/$asset_id"
          gh api --method POST "https://uploads.github.com/repos/ZIADMMX/fox-releases/releases/$release_id/assets?name=latest.yml" -H "Content-Type: application/x-yaml" --input release/latest.yml
          gh api --method PATCH "repos/ZIADMMX/fox-releases/releases/$release_id" -F draft=false
